<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plan Obfuscator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script defer src="{{ url_for('static', path='app.js') }}"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Plan Obfuscator</a>
    <span class="badge">Oracle 19c · local</span>
  </header>
  <main class="shell">
    {% if notice %}<div class="flash success">{{ notice }}</div>{% endif %}
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
