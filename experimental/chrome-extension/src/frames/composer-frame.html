<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plan Obfuscator</title>
    <link rel="stylesheet" href="composer-frame.css">
  </head>
  <body>
    <main class="composer" id="composer">
      <textarea id="prompt" rows="3" spellcheck="false" placeholder="Введите prompt, SQL или план Oracle…"></textarea>
      <div class="bar">
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">Готово к защите</span>
        </div>
        <div class="actions">
          <button class="copy hidden" id="copy-safe" type="button">Копировать OBF</button>
          <button class="secondary hidden" id="unsafe" type="button">Отправить без защиты</button>
          <button class="primary" id="protect" type="button">🛡 Обфусцировать</button>
        </div>
      </div>
    </main>
    <script type="module" src="composer-frame.js"></script>
  </body>
</html>
