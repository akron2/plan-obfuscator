name: Chrome extension (experimental)

on:
  push:
    branches: [main]
    paths:
      - "experimental/chrome-extension/**"
      - "test-corpus/**"
  pull_request:
    paths:
      - "experimental/chrome-extension/**"
      - "test-corpus/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: experimental/chrome-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experimental/chrome-extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: node scripts/verify-build.mjs
